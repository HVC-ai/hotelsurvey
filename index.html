
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Feedback Survey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f1eb;
      color: #303b36;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      background: white;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
      letter-spacing: 1px;
    }

    p {
      margin: 0 0 28px;
      color: #68716c;
      line-height: 1.6;
    }

    .language {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 16px;
      border: 1px solid #d8ddd9;
      border-radius: 8px;
      background: white;
      color: #303b36;
      font-size: 17px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .language:hover {
      background: #edf2ee;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #8a918c;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>GUEST FEEDBACK</h1>
    <p>Please select your preferred language<br>
       Vui lòng chọn ngôn ngữ của bạn</p>

    <a class="language"
       href="https://forms.cloud.microsoft/r/Gs2aN00TpE?lang=en-US">
       🇬🇧 English
    </a>

    <a class="language"
       href="https://forms.cloud.microsoft/r/Gs2aN00TpE?lang=vi-VN">
       🇻🇳 Tiếng Việt
    </a>

    <a class="language"
       href="https://forms.cloud.microsoft/r/Gs2aN00TpE?lang=ko-KR">
       🇰🇷 한국어
    </a>

    <a class="language"
       href="https://forms.cloud.microsoft/r/Gs2aN00TpE?lang=ja-JP">
       🇯🇵 日本語
    </a>

    <div class="footer">
      Thank you for sharing your experience with us.
    </div>
  </main>
</body>
</html>
